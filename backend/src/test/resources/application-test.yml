spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

timefold:
  solver:
    termination:
      spent-limit: 2s

routeresq:
  jwt:
    secret: super-secret-test-key-that-is-at-least-256-bits-long-for-hmac-sha-256-security-routeresq-2026
    expiration-ms: 600000
    refresh-expiration-ms: 3600000

logging:
  level:
    root: WARN
    com.routeresq: DEBUG
