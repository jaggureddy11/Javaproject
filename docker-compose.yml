version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: routeresq-postgres
    restart: always
    environment:
      POSTGRES_DB: routeresq_db
      POSTGRES_USER: routeresq_user
      POSTGRES_PASSWORD: routeresq_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeresq_user -d routeresq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: routeresq-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
